name: Publish app for partners

# dist/TransBubble.apk 를 바꿔 올리면 공개 Release를 자동으로 만든다.
# 초대 페이지(join.html)의 다운로드 버튼은 항상 최신 Release의 TransBubble.apk 를 받는다.
on:
  push:
    branches: [main]
    paths: ["dist/TransBubble.apk", "dist/version.txt"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Read version
        id: v
        run: echo "ver=$(tr -d '[:space:]' < dist/version.txt)" >> "$GITHUB_OUTPUT"
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.v.outputs.ver }}
          name: TransBubble ${{ steps.v.outputs.ver }}
          body: Android app for invited partners (English ⇄ Korean live subtitles).
          files: dist/TransBubble.apk
          make_latest: true
